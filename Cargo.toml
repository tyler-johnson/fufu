[workspace]
resolver = "3"
members = ["crates/ff-core", "crates/ff-cli", "crates/ff-testsupport"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
ff-core = { path = "crates/ff-core" }
ff-testsupport = { path = "crates/ff-testsupport" }
gix = { version = "0.73.0", default-features = false, features = [
    "status",
    "revision",
    "max-performance-safe",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
