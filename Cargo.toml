[workspace]
resolver = "3"
members = ["crates/ff-core", "crates/ff-cli", "crates/ff-testsupport"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tyler-johnson/fufu"

[workspace.dependencies]
ff-core = { path = "crates/ff-core" }
ff-testsupport = { path = "crates/ff-testsupport" }
gix = { version = "0.73.0", default-features = false, features = [
    "status",
    "revision",
    "max-performance-safe",
    "tree-editor",
    "interrupt",
    "merge",
    "blob-diff",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anstyle = "1"
anstream = "1"
tempfile = "3"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Local dogfood builds: release semantics without the LTO link cost.
# Separate target dir (target/dogfood), so it never thrashes the pristine
# fat-LTO target/release that benches and shipping use.
[profile.dogfood]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
