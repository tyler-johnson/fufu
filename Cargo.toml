[workspace]
resolver = "3"
members = ["crates/ff-core", "crates/ff-cli", "crates/ff-testsupport"]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tyler-johnson/fufu"

[workspace.dependencies]
ff-core = { path = "crates/ff-core" }
ff-testsupport = { path = "crates/ff-testsupport" }
gix = { version = "0.87.1", default-features = false, features = [
    "status",
    "revision",
    "max-performance-safe",
    "sha1",
    "interrupt",
    "merge",
    "blob-diff",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anstyle = "1"
anstream = "1"
tempfile = "3"
getrandom = "0.4"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# Already linked through gix's transport at this version; named here so the
# fetch lane can put a per-request deadline on the request gix builds.
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }

# Debug and test builds keep line tables but drop full DWARF: panics and
# backtraces still name their file and line, while the per-binary debuginfo
# that grew target/debug/deps to 171G goes away. `[profile.test]` inherits
# this, so `cargo test` artifacts shrink with it.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Local dogfood builds: release semantics without the LTO link cost. Its own
# profile dir (<target>/dogfood), so it never thrashes the pristine fat-LTO
# release dir that benches and shipping use.
[profile.dogfood]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
