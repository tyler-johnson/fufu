[package]
name = "ff-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fufu (ff): jj's workflow on git's repository — the CLI"
publish = false

[[bin]]
name = "ff"
path = "src/main.rs"

[dependencies]
ff-core.workspace = true
# The wire belongs to the CLI, so the transport feature is declared here
# rather than on the workspace table: `ff clone` speaks the git protocol
# itself, over reqwest/rustls. rustls rather than curl — the binary already
# carries rustls through `ureq`, and libcurl on the windows-11-arm release
# runner is a build risk with nothing to buy it.
gix = { workspace = true, features = [
    "blocking-http-transport-reqwest-rust-tls",
    # The checkout half of a clone. `ff clone` writes the worktree itself,
    # which is the difference between owning the sequence and narrating one.
    "worktree-mutation",
] }
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
anstyle.workspace = true
anstream.workspace = true
ureq.workspace = true
# The Model Context Protocol has two handshake eras — the `initialize`
# exchange the 2024 and 2025 revisions open with, and the stateless
# `server/discover` the 2026 revisions require — and a client may speak
# either. `ff mcp` is one tool over stdio, and a hand-rolled JSON-RPC loop
# would be small, but the version negotiation between those eras is the
# part that keeps moving, and the SDK serves both from one handler. That is
# what is bought here, the same way `gix` buys git's object model.
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-io"] }
# Already in the lock through reqwest, with none of the runtime features.
# The MCP server needs a runtime to drive stdio and the child it relays to.
tokio = { version = "1", features = ["rt", "process", "macros"] }

# PowerShell's profile lives under the Documents known folder, which
# OneDrive can redirect; `ff hook powershell` asks the shell API where that
# is, the way PowerShell itself resolves `$PROFILE`. Already in the lock as
# a transitive of the terminal crates. The ToolHelp and Threading features
# are the same precedent — a feature on a crate already in the lock, not a
# crate — and buy `ff mcp` its parent pid, which Windows has no `getppid`
# for.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
ff-testsupport.workspace = true
tempfile.workspace = true
