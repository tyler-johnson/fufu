# Curated error IDs, in the order `ff explain --list` displays them.
# Details are wrapped for the terminal at render time. Keep IDs and field names stable; edit prose and repair commands here, then run make docs-gen.

[[entry]]
id = "branch/exists"
summary = "a branch with that name already exists"
detail = "Choose an unused name and retry the create or rename. If you meant to work on the existing branch, use ff switch <branch>. Switching resumes that branch's parked change; it does not rename the current branch or move your current edits into the destination. ff branch lists the available names."
exits = ["ff branch", "ff switch <branch>"]

[[entry]]
id = "branch/not-found"
summary = "the requested branch or ref was not found"
detail = "Check the name with ff branch and retry with an existing branch. Some commands require a local branch even when a remote copy exists. ff switch can create a local tracking branch from a remote-only name such as origin/topic; ff remote lists configured remotes. Listings use locally available refs unless a fetch refreshes them. If a session's destination branch was deleted, inspect ff op log for its retained state before deciding how to recover it."
exits = ["ff branch", "ff remote"]

[[entry]]
id = "branch/ambiguous"
summary = "that name matches more than one branch"
detail = "Use a full name from the candidates in the error. A local prefix must identify one branch. When the same branch name exists on multiple remotes, qualify it as <remote>/<branch>, such as origin/topic. ff branch lists local and remote-only names."
exits = ["ff branch"]

[[entry]]
id = "branch/invalid-name"
summary = "that branch name is not a valid Git ref name"
detail = "Change the name and retry. The error identifies the rejected spelling; spaces, repeated dots, and a component ending in .lock are common causes. Fufu validates the full refs/heads/<name> form using Git ref-name rules. Quoting a name for the shell does not make an invalid ref name valid."
exits = []

[[entry]]
id = "branch/is-current"
summary = "the branch to delete is the current branch"
detail = "Switch to a different branch, then retry the deletion. Switching parks eligible uncommitted work with the branch you leave and resumes the destination's work. Deleting a branch afterward also removes its active parked state; retained snapshots are the recovery source. Copy ignored or uncaptured files separately if you need to preserve them."
exits = ["ff switch <other-branch>", "ff branch"]

[[entry]]
id = "branch/checked-out-elsewhere"
summary = "another worktree has that branch checked out"
detail = "Use ff worktree to locate the checkout named in the error. Work on the branch there with ff -C <path>, or switch that checkout to a different branch before retrying here. For a fold into a branch checked out elsewhere, --stay can update it there while keeping the source branch here; inspect ff help fold for its file effects. Removing a checkout also frees the branch, but first preserve anything its snapshots cannot capture."
exits = ["ff worktree", "ff -C <path> status"]

[[entry]]
id = "branch/shared-lease-refused"
summary = "the remote refused the deletion lease after the local branch was deleted"
detail = "Use ff undo to recover the local deletion, then inspect the remote copy before retrying. The remote ref did not match the deletion's expected value, so that remote deletion was refused. The local deletion already happened and can be recovered while its undo state remains available. After restoring the branch, ff pull <branch> fetches and reports its remote state; review the result before asking for a shared deletion again."
exits = ["ff undo", "ff branch"]

[[entry]]
id = "branch/shared-moved"
summary = "the remote-tracking tip differs from the seen record; deletion was refused"
detail = "Run ff pull <branch> and inspect what arrived before retrying ff branch -d <branch> --shared. The local branch and remote copy have not been deleted by this request. Shared deletion requires the cached remote-tracking tip to match fufu's seen record. A fetch can move the tracking ref without updating that record; a reporting pull updates what fufu records as seen. Resolve any resulting hold before continuing."
exits = ["ff pull <branch>", "ff branch"]

[[entry]]
id = "branch/shared-unseen"
summary = "there is no seen record for the remote copy; deletion was refused"
detail = "Run ff pull <branch> to fetch and report the remote copy, then review it before retrying the shared deletion. Fufu has no recorded seen tip to use for this deletion's lease, for example after an upstream was configured through Git. This request has deleted neither the local branch nor the remote copy. A fetch alone does not establish the seen record."
exits = ["ff pull <branch>", "ff branch"]

[[entry]]
id = "repo/bare"
summary = "this is a bare repository, and the command needs a working copy"
detail = "Run the command in a non-bare clone or an existing working checkout. A bare repository has Git objects and refs but no working files to snapshot, inspect with ff status, edit, or restore. Commands that need those files refuse here. ff explain works without a working copy."
exits = []

[[entry]]
id = "repo/detached"
summary = "the command needs a branch with a usable current state"
detail = "If HEAD is detached, switch to an existing branch or create one at the commit you want to keep with ff switch HEAD -b <name>. The command needs a branch to describe, record, or rewrite. The message may instead say that nothing is committed yet: ff resolve also uses this ID on an unborn branch. In that case, make the first nonempty commit before attempting work that needs committed history."
exits = ["ff status", "ff switch <branch>"]

[[entry]]
id = "identity/missing"
summary = "the commit author name or email is not configured"
detail = "Set user.name and user.email in Git configuration, then retry. Add --global to the config commands to use that identity across repositories. Snapshots and internal open-change objects need an identity as well as commits recorded in branch history. Fufu uses Git's resolved committer identity for both author and committer on new work; GIT_COMMITTER_NAME and GIT_COMMITTER_EMAIL can override the configuration. These are identity fields, not cryptographic signing keys."
exits = ["git config user.name <name>", "git config user.email <email>"]

[[entry]]
id = "repo/mid-operation"
summary = "an unfinished Git operation blocks this command"
detail = "Run git status in the checkout named in the error and finish or abort that operation there. After fixing and staging its conflicts, use git rebase --continue, git merge --continue, git cherry-pick --continue, git revert --continue, or git am --continue as appropriate. Each has a matching --abort. For a bisect, continue with git bisect good/bad or end it with git bisect reset. ApplyMailbox means git am; ApplyMailboxRebase belongs to a rebase. Retry the fufu command after Git has left that state."
exits = ["git status"]

[[entry]]
id = "usage/absorb-into-open"
summary = "absorb's default source and the requested target are both the open change"
detail = "Choose a committed target with --into, or name committed sources with --from when the target should be @. Absorb defaults to taking content from the open change, so ff absorb --into @ alone tries to move that content into itself. ff log shows committed targets. A target must belong to the history being rewritten."
exits = ["ff log", "ff absorb --into <rev>", "ff absorb --from <revset> --into @"]

[[entry]]
id = "usage/move-into-self"
summary = "the move's only source is its target"
detail = "Choose a different --into target or include other --from sources. Absorb and lift exclude the target itself from the source set. After that exclusion, this request has no source content to move. Use ff log to check the selected commits before retrying."
exits = ["ff absorb --from <revset> --into <rev>", "ff lift --from <revset> --into <rev>", "ff log"]

[[entry]]
id = "usage/move-gap"
summary = "the sources are not one contiguous run of commits"
detail = "Select the full first-parent run between the lowest and highest source, or move separate runs in separate commands. The open change may be included above the committed sources. The suggested range includes intermediate commits you omitted, so inspect it before using it. For committed endpoints, <lo>~..<hi> includes both endpoints when <lo> has a parent; <lo>::<hi> also includes a root endpoint. Use bounded endpoints to avoid selecting unrelated visible history."
exits = ["ff log -r '<lo>::<hi>'", "ff absorb --from '<lo>::<hi>' --into <target>", "ff lift --from '<lo>::<hi>'"]

[[entry]]
id = "absorb/into-trunk"
summary = "absorb's implicit target would rewrite a trunk commit"
detail = "Name the intended target with --into. When committed sources reach the bottom of a branch, absorb's default target, the commit below the lowest source, can be on trunk. That implicit committed-source rewrite is refused. To combine the run within the feature branch, select the commits above its lowest commit and target that lowest commit. Adding only open-change content to the current trunk tip is allowed; this guard is not a general ban on rewriting trunk."
exits = ["ff log", "ff absorb --from '<lo>..<hi>' --into <lo>"]

[[entry]]
id = "usage/bad-restore-target"
summary = "--at could not parse the requested age or date"
detail = "Use a compact age such as 90s, 15m, 2h, 3d, or 1w, or a supported date such as '2026-09-13 12:00:00 +0000'. --at selects the latest retained operation at or before that time. Use --at-op for a hexadecimal operation ID and restore's --from for a revision. A valid time may still have no retained operation to select."
exits = ["ff op log", "ff restore <path> --at 2h", "ff restore <path> --at-op <op>"]

[[entry]]
id = "restore/nothing-selected"
summary = "restore needs paths or --all"
detail = "Name the files or directories to restore, or pass --all for the whole captured tree. Without a source flag, restore reads HEAD, the commit under the open change. Choose --from <rev>, --at-op <op>, or --at <time> for another source. Restore replaces selected working files and preserves HEAD and the index; its pre-command snapshot can recover only content that was successfully captured and retained."
exits = ["ff restore <path>", "ff restore --all", "ff restore <path> --at-op <op>"]

[[entry]]
id = "undo/nothing"
summary = "the current worktree's operation log has no undo step"
detail = "Inspect ff history or ff op log to see what this worktree has recorded. There may be no operations yet, or only notes that undo skips. Undo cannot reconstruct work from before snapshots were enabled, uncaptured file content, or another worktree's independent history. A retained snapshot can still be used for selected file recovery with ff restore <path> --at-op <op>."
exits = ["ff history", "ff op log"]

[[entry]]
id = "undo/not-undoable"
summary = "op revert cannot invert a capture or note"
detail = "Use ff restore with a retained snapshot to recover files, or inspect ff history for a whole-state undo step. ff op revert only inverts recorded user-ref transitions. Captures store working-copy state without those transitions, and notes record events such as a push rather than an invertible local ref update. Undoing local history cannot reverse a remote push."
exits = ["ff op show <op>", "ff restore <path> --at-op <op>", "ff history"]

[[entry]]
id = "undo/trimmed"
summary = "some objects needed for the requested state are missing"
detail = "Inspect the missing pieces named in the error and choose an intact retained state if possible. ff op restore <op> --force attempts the available parts and reports what is missing; it cannot recreate missing objects. Ordinary undo refuses this incomplete restoration. Retention defaults to 90 days through fufu.keep, but increasing it now does not restore already removed state. Pre-command capture or reconciliation may already have run."
exits = ["ff op log", "ff op restore <op> --force", "ff config keep <duration>"]

[[entry]]
id = "op/not-found"
summary = "the requested operation or recovery source was not found"
detail = "Use ff op log to choose a retained operation. Operation IDs are hexadecimal, and @ names the live operation tip; --at-op reads this address space, while --from reads revisions. This ID also covers an invalid address, a time before the retained log, or a target with no shared operation history. If restore says the unborn branch has no HEAD source, select a retained snapshot with --at-op instead. Change IDs use k-z letters and belong in revision positions."
exits = ["ff op log"]

[[entry]]
id = "op/ambiguous"
summary = "that hexadecimal prefix matches more than one retained operation"
detail = "Use more hexadecimal characters or the full operation ID. Prefix uniqueness is checked across retained live and abandoned history, including other worktrees, rather than just the rows currently displayed. The candidates in the error are shortened for display; ff op log --json provides full IDs for its selected history."
exits = ["ff op log --json"]

[[entry]]
id = "op/trimmed"
summary = "that operation is outside retained live history"
detail = "Choose a retained operation from ff op log. A trimmed operation's object may still decode while the object remains on disk, but ordinary whole-state restoration requires retained history. ff op restore <op> --force can attempt an explicitly selected surviving object and report missing state; it does not recover objects already removed. A longer fufu.keep protects future history, not history already trimmed."
exits = ["ff op log", "ff config keep <duration>"]

[[entry]]
id = "op/floor"
summary = "the request steps before the earliest retained operation"
detail = "Use ff op log to find the earliest available recovery point and choose a target at or after it. Undo needs a predecessor to restore the state before a step; the oldest retained operation has none. An address such as @~100 also fails when it asks for more predecessors than remain. Earlier state may never have been captured or may have been removed by retention."
exits = ["ff op log"]

[[entry]]
id = "op/unreadable"
summary = "required operation or ref data is unavailable or unusable"
detail = "Read the specific message before choosing a repair. This ID covers malformed records, missing ref tables, failed ref iteration, and op revert selecting an operation that moved no refs. For the last case, inspect ff op show <op> and choose file restoration or a whole-state undo instead. For damaged records or refs, ff doctor can report findings and git fsck can inspect objects, but doctor --fix does not reconstruct missing operation data. Preserve any remaining history and report reproducible decoding failures."
exits = ["ff doctor", "git fsck"]

[[entry]]
id = "commit/empty"
summary = "there are no selected changes to commit"
detail = "Edit files or choose paths that differ from HEAD, then retry. The open change exists but its selected content is empty; a partial commit can refuse even when other paths have changes. No branch-history commit is created. A previously saved pending message remains, but -m supplied only to this failed commit is not saved. Use ff describe -m <message> to save it for later. Capture or reconciliation may have run before the refusal."
exits = ["ff status", "ff diff", "ff describe -m <message>"]

[[entry]]
id = "ref/contended"
summary = "a ref update lost a race or could not acquire its lock"
detail = "Wait for the other writer and retry, with a bounded retry count in scripts. Read the specific message first: contention can occur during capture, during a later ref update, or after files and refs have been restored but before the operation pointer moves. Earlier writes are not rolled back merely because the exit is 4. For a state-changing command, inspect ff status and ff op log before retrying if the message reports partial progress; preserve explicit target IDs because relative addresses may now resolve differently. Persistent contention needs investigation of the named lock or writer."
exits = []

[[entry]]
id = "hook/failed"
summary = "a client's hook file or plugin directory could not be written, or did not read back"
detail = "Read the named path and the operating-system diagnostic. ff hook writes a plugin directory or settings entries and then reads them back the way the client does; a write that fails or a plugin that does not verify leaves any older wiring in place, so capture through that client is whatever it was before. Fix permissions or the path, then rerun ff hook <slug>. ff hook -l shows the current wiring."
exits = ["ff hook -l", "ff help hook"]

[[entry]]
id = "hook/malformed"
summary = "a client's config file is not the JSON object its client reads"
detail = "The named file is not valid JSON, or its top level or one of the keys ff hook merges into is not the shape the client documents (for Copilot CLI, enabledPlugins and extraKnownMarketplaces must be objects). The file is untouched: fufu never rewrites a file it cannot read into something the client cannot read either. Repair the file by hand or restore it from the client, then rerun ff hook <slug>. For Codex the file may be the personal marketplace at ~/.agents/plugins/marketplace.json, which the plugin install merges an entry into. hook/failed is also what ff hook opencode raises for a plugins/fufu.js fufu did not write: move it aside."
exits = ["ff hook -l", "ff help hook"]

[[entry]]
id = "hook/declined"
summary = "a commit-time Git hook exited unsuccessfully"
detail = "Read the named hook's output, fix its reported problem, and rerun the same command with its original targets, paths, and message. Hooks may have edited working files even though the commit did not land. Fufu restores a temporary hook index when the operation does not land. --no-verify skips pre-commit and commit-msg if you choose to bypass them; it does not skip prepare-commit-msg, which must be fixed. Post-commit is notification-only and cannot cause this refusal. Hook execution depends on the command and whether it commits open content or authors a message."
exits = ["ff status", "ff help commit"]

[[entry]]
id = "sign/unknown-format"
summary = "gpg.format is not openpgp, x509, or ssh"
detail = "Set gpg.format to the format of your signing key: openpgp uses gpg, x509 uses gpgsm, and ssh uses ssh-keygen. Check inherited Git configuration before changing it. To proceed unsigned, remove an explicit --sign/-S and use --no-sign on the same command where supported, or set commit.gpgsign false for the intended scope. Unsetting a local value can expose an enabled global value. Earlier snapshots or object writes may already exist."
exits = ["git config --show-origin --get gpg.format", "ff help commit"]

[[entry]]
id = "sign/no-key"
summary = "SSH signing has no configured or default key"
detail = "Set user.signingkey to your SSH signing key, or configure gpg.ssh.defaultKeyCommand to return one. The example path must exist on your machine. A public key can be used when ssh-keygen can access its private key, including through an SSH agent. To proceed unsigned, retry the original command with --no-sign where supported and without --sign/-S. Fufu has not produced the requested signature; pre-command snapshots may already exist."
exits = ["git config user.signingkey <key-path>", "ff doctor"]

[[entry]]
id = "sign/no-program"
summary = "the configured signing program could not be started"
detail = "Install or repair the program named in the error and make it executable on PATH, or correct its configured path. Defaults are gpg, gpgsm, and ssh-keygen; gpg.program and gpg.<format>.program can override them. ff doctor checks the signing configuration and simple program availability, not whether your key can sign. If you choose unsigned output, retry the original command with --no-sign where supported and without --sign/-S."
exits = ["ff doctor", "git config --show-origin --get-regexp '^gpg\\.'"]

[[entry]]
id = "sign/failed"
summary = "the signer failed or did not produce a signature"
detail = "Use the signer's diagnostic to check key access, passphrase entry, agent availability, and program configuration, then retry the original command. ff doctor can check configuration but cannot prove that a key is accessible. Signing failure prevents that signed commit from landing; it does not imply the entire invocation made no earlier writes or updates. If unsigned output is intended, retry with --no-sign where supported and without --sign/-S."
exits = ["ff doctor", "ff status"]

[[entry]]
id = "editor/failed"
summary = "the description editor could not start or exited unsuccessfully"
detail = "Fix VISUAL or EDITOR, or pass the message with -m to the same describe command. Fufu tries VISUAL, then EDITOR, then vi. The failed editor result does not replace the description. If you were describing a recorded commit, retain its revision argument when retrying; ff describe -m alone changes the open change's pending message."
exits = ["ff help describe"]

[[entry]]
id = "target/unresolvable"
summary = "the command has no usable committed target"
detail = "Choose a target appropriate to the command. An unborn branch needs its first nonempty commit before branching from @ or rewriting history. ff edit @ and ff restore --from @ refuse because @ is already the open change; use HEAD to edit or restore from the commit beneath it. A root commit has no parent for absorb's implicit target, so name --into explicitly. If the message names a missing trunk target, inspect ff branch and the trunk setting."
exits = ["ff log", "ff branch"]

[[entry]]
id = "switch/nothing-opened"
summary = "-m cannot describe a new change when switching to an existing branch"
detail = "Switch to the existing branch without -m, then run ff describe -m <msg> there if you want to replace its pending message. This refused switch has not taken you to the destination. A switch to an existing branch resumes its parked change and description. The switch -m option is for a change on a newly created branch."
exits = ["ff switch <branch>", "ff help describe"]

[[entry]]
id = "usage/revset-adjacent-operands"
summary = "two revision expressions need an operator between them"
detail = "Insert | for union, & for intersection, or & ~ for set difference, and quote the whole expression for your shell. Fufu does not accept jj's infix a ~ b spelling; use a & ~b. Without an operator, adjacent names do not form a revision set."
exits = ["ff log -r '<a> & ~<b>'", "ff log -r '<a> | <b>'"]

[[entry]]
id = "usage/revset-parent-shorthand"
summary = "use ^ or ~n for parents, not the x- shorthand"
detail = "Replace x- with x^ and a numbered first-parent walk with x~n. In revision space @^ is HEAD and @~2 is HEAD~. In operation space @^ is the preceding operation and @~3 follows three predecessor links. A dash inside an ordinary branch name such as my-branch is still valid."
exits = ["ff log -r '<x>^'", "ff log -r HEAD", "ff op show @^"]

[[entry]]
id = "revset/deferred-descendants"
summary = "x+ and descendants() are not implemented"
detail = "Use x:: to request x and its visible descendants, or x::y to bound the selection by a committed endpoint. These are not depth-limited children queries. Fufu currently refuses x+ and descendants(), including depth arguments. Inspect the resulting set before using it in a rewrite; the revisions reference documents current open-change and equal-time traversal limits."
exits = ["ff log -r '<x>::'", "ff log -r '<x>::<y>'"]

[[entry]]
id = "usage/revset-no-symmetric-difference"
summary = "the a...b range syntax is not supported"
detail = "Use (a..b) | (b..a) to select commits reachable from either endpoint but not both. Quote the expression so the shell passes its operators unchanged. Fufu's range operators are .. and ::; it does not accept Git's three-dot shorthand. Use committed endpoints when you need the ordinary set identities; @ has separately documented range limits."
exits = ["ff log -r '(<a>..<b>) | (<b>..<a>)'"]

[[entry]]
id = "usage/revset-expected-expression"
summary = "an operator or function call is missing an expression"
detail = "Complete the expression named in the error. Common causes are a trailing & or |, a complement ~ without an operand, or a trailing comma in a function call. Use ~x for complement; ^ is a suffix on a revision, not a prefix operator. Quote the complete expression when passing it through a shell."
exits = ["ff log -r '~<x>'"]

[[entry]]
id = "usage/revset-unbalanced-parens"
summary = "the expression has unmatched parentheses or a misplaced comma"
detail = "Pair every opening parenthesis with a closing one and use commas only between function arguments. Quote the whole expression so the shell passes the parentheses and operators to fufu unchanged. The error names the unmatched part."
exits = ["ff log -r '(<a> | <b>) & <c>'"]

[[entry]]
id = "usage/revset-unterminated-brace"
summary = "a revision suffix has an opening brace without its closing brace"
detail = "Close the brace in the suffix named in the error, and quote expressions containing spaces. Examples include main@{1}, main@{2 days ago}, and HEAD^{commit}. Message-search suffixes such as HEAD^{/fix} search literal text in the current implementation. Closing a brace fixes the syntax; the suffix must still resolve to a supported object or commit."
exits = ["ff log -r '<branch>@{1}'"]

[[entry]]
id = "usage/revset-unterminated-quote"
summary = "a quoted pattern value is missing its closing quote"
detail = '''Close the double quote around the pattern and preserve it inside the shell argument. For example, ff log -r 'description(substring:"fix bug")' passes one expression containing a quoted pattern. Within pattern quotes, only \" and \\ are escapes; other backslashes remain literal. A regex: pattern still refuses after its quoting is fixed because regex matching is not implemented.'''
exits = ["ff log -r 'description(substring:\"<text>\")'"]

[[entry]]
id = "usage/revset-empty"
summary = "the revision expression contains no text"
detail = "Supply an expression such as @, HEAD, or ::HEAD, or omit -r to use ff log's default view. An empty or whitespace-only argument is invalid syntax. This differs from a valid expression whose evaluated set has no members, which a single-target command reports as usage/revset-empty-set."
exits = ["ff log", "ff log -r @"]

[[entry]]
id = "usage/revset-open-suffix"
summary = "that suffix is not supported on the open change @"
detail = "Use HEAD for suffixes that need a committed ref. In revision space @ is the open change; its parent suffixes step onto HEAD, so @^ is HEAD and @~2 is HEAD~. The open change has no reflog: @{1} reads HEAD's reflog, while @@{1} is refused. Tree-peeling and other non-parent suffixes on @ are also refused."
exits = ["ff log -r '@{1}'", "ff log -r HEAD"]

[[entry]]
id = "usage/revset-range-suffix"
summary = "x^! and x^@ are not supported revision suffixes"
detail = "Use an explicit revision set. To select only x, name x directly. To select a commit's parents, name x^ and, for a merge, x^2 and any additional parents, joined with |. Git's x^! and x^@ expand into revision-list selections rather than a single revision, and fufu does not accept those shorthands."
exits = ["ff log -r <x>", "ff log -r '<x>^'", "ff log -r '<x>^ | <x>^2'"]

[[entry]]
id = "usage/revset-ambiguous"
summary = "that name or prefix has multiple revision matches"
detail = "Use a full ref path, a full commit SHA, or more of the change ID to select the intended match. A name may match a ref and an object or change ID at once, or a prefix may match several objects or changes. The error lists alternatives when available. Highlighting in ff log is local to the displayed page and is not proof that a short prefix resolves uniquely across the repository."
exits = ["ff log -r refs/heads/<name>", "ff log -r <full-sha>"]

[[entry]]
id = "usage/revset-divergent"
summary = "one change ID identifies multiple visible commits"
detail = "Select the desired copy by its commit SHA from the candidates in the error. Rewrites preserve a surviving change's ID while changing its SHA; another ref can keep an older copy visible. Extending the change-ID prefix, even to the full ID, cannot choose between copies of the same change. Inspect the copies before moving or deleting refs that keep them visible."
exits = ["ff show <sha>", "ff log"]

[[entry]]
id = "usage/revset-unknown-revision"
summary = "no revision matches that name or prefix"
detail = "Check ff log and ff branch, then correct the name or use a longer ID. Commit-SHA and change-ID prefixes need at least four characters. Change lookup searches local history first and uses remote history as a fallback, with a 10,000-commit search limit. An operation ID belongs to ff op show or --at-op, not a revision argument. A commit absent from this repository may need to be fetched before it can resolve."
exits = ["ff log", "ff branch"]

[[entry]]
id = "usage/revset-not-a-commit"
summary = "the revision names a tree or blob rather than a commit"
detail = "Use the commit that contains the object. A spelling such as HEAD^{tree} or HEAD:path names stored content, while this command needs a commit or revision set. For file history, pass the path as ff log's positional argument and put the commit selection behind -r."
exits = ["ff log", "ff log <path> -r <rev>"]

[[entry]]
id = "usage/op-in-rev-position"
summary = "an operation ID was used where a revision is required"
detail = "Use ff op show <op> to inspect the operation, or restore's --at-op to recover files from its snapshot. Commit SHAs and operation IDs are both hexadecimal, but the argument position selects their meaning. Change IDs use k-z letters and identify revisions. To query the commits operations ran on, use base(<operation-expression>) in revision space. Only restore and op log/show/diff implement past-state flags."
exits = ["ff op show <op>", "ff log -r 'base(<op>)'"]

[[entry]]
id = "usage/rev-in-op-position"
summary = "a revision or non-operation parent was used in operation space"
detail = "Use an operation ID from ff op log, or move the revision to ff log -r or ff show. In an operation expression, on_branch(<name>) filters the log for a branch. Operation ^ and ~n follow predecessor links; parent slots above 1 are refused because they do not select preceding operations. Use base(<operations>) in revision space to select the recorded base commits explicitly."
exits = ["ff op log", "ff op log 'on_branch(<name>)'", "ff log -r 'base(@)'"]

[[entry]]
id = "usage/revset-unknown-function"
summary = "that function is not available in this address space"
detail = "Check the function name and whether you are selecting revisions or operations. Both spaces support latest, heads, and roots. Revision predicates are description and author; operation predicates are on_branch, session, and kind. base takes an operation expression and returns commits, so it belongs in revision space. All implemented functions take one argument."
exits = ["ff log -r 'latest(HEAD)'", "ff op log 'kind(op)'"]

[[entry]]
id = "usage/revset-arity"
summary = "a function received the wrong argument count, kind, or value"
detail = "Match the signature named in the error. Implemented functions take one set or pattern argument. latest(HEAD) takes a set; description(substring:fix) takes a text pattern, and description(fix) treats the bare word as substring text. A compound set such as a | b is not a text pattern. kind accepts only capture, op, foreign, or note."
exits = ["ff log -r 'description(substring:\"<text>\")'", "ff op log 'kind(op)'"]

[[entry]]
id = "usage/revset-wrong-space"
summary = "that function belongs in the other address space"
detail = "Put on_branch, session, and kind in an operation expression, such as ff op log 'kind(op)'. Put base(<operations>) in a revision expression, such as ff log -r 'base(@)'. base returns the commits recorded as operation bases and cannot itself be selected as a set of operations."
exits = ["ff op log 'kind(op)'", "ff log -r 'base(@)'"]

[[entry]]
id = "usage/revset-empty-set"
summary = "the expression is valid but selects no target"
detail = "Inspect the expression with ff log -r before retrying the command that needs a target. Check range direction, intersections, and predicates that may match nothing. This is an evaluated empty result, not an empty argument or unknown revision name. Readers can display empty sets; a command needing one or more targets refuses them."
exits = ["ff log -r '<expr>'", "ff branch"]

[[entry]]
id = "usage/revset-not-a-point"
summary = "the expression selects multiple revisions where one is required"
detail = "Inspect the set, then name one commit SHA, change ID, or branch tip. latest(<expr>) selects its newest member if that is the choice you intend. heads(<expr>) narrows to members with no descendants in the set but can still return several, so inspect its result before using it as a single target."
exits = ["ff log -r '<expr>'", "ff log -r 'latest(<expr>)'"]

[[entry]]
id = "revset/regex-unavailable"
summary = "regex patterns are recognized but not implemented"
detail = "Use glob: for * and ? wildcards, substring: for literal text anywhere in a field, or exact: for an exact match. regex: is recognized and refused rather than evaluated. These pattern forms are not interchangeable with a regular expression, so check the selected results before using them to rewrite history."
exits = ["ff log -r 'description(glob:\"fix*\")'", "ff log -r 'description(substring:\"fix\")'"]

[[entry]]
id = "usage/unknown-key"
summary = "that name is not a supported fufu setting"
detail = "Use ff config to list supported keys, then retry with one of those names. The short form and fufu.<key> form select the same setting. Git settings such as user.name belong to git config. An unknown key is not written by ff config."
exits = ["ff config"]

[[entry]]
id = "usage/bad-value"
summary = "the value is not valid for this setting or option"
detail = "Use the type or accepted values named in the error. For configuration, ff config <key> shows the setting's value and description; the rejected value has not been saved. For ff watch --kind, choose capture, op, foreign, or note. A value valid for one setting or option may not be valid for another."
exits = ["ff config", "ff help watch"]

[[entry]]
id = "usage/bad-flags"
summary = "an option is missing, retired, misplaced, or incompatible with another"
detail = "Follow the specific message and inspect ff help <command> for the supported form. Some cases require choosing one of conflicting options; others replace an old spelling or supply a required argument. --at and --at-op are mutually exclusive, and accepting their syntax does not mean every command implements past-state reads. On restore, name paths or --all as well as the source."
exits = ["ff help"]

[[entry]]
id = "usage/unknown-slug"
summary = "the hook integration name is unknown or could not be inferred"
detail = "Choose a name from ff hook -l: claude, codex, qwen, opencode, copilot, cursor, bash, zsh, fish, or powershell. Pass it directly to ff hook or ff unhook. If SHELL does not identify a supported shell, name that shell explicitly. Installation still needs client activation: restart or reload shell configuration, and complete any client hook approval. gemini is a retired source: ff trigger gemini still captures from a settings file an earlier fufu wrote, but ff hook and ff unhook no longer touch ~/.gemini. An unknown client-trigger name is handled quietly instead of using this interactive refusal."
exits = ["ff hook -l", "ff help hook"]

[[entry]]
id = "usage/no-such-directory"
summary = "fufu could not enter the directory given to -C"
detail = "Correct the path or its permissions, then retry with -C pointing to an existing directory. The operating-system diagnostic distinguishes a missing path, a non-directory, and access failure. Relative paths start at the invoking directory. This change of directory happens before command capture, so a failed -C has not captured the intended checkout. Use ff -C <existing-checkout> worktree to locate linked checkouts from a known repository."
exits = ["ff -C <existing-checkout> worktree"]

[[entry]]
id = "usage/no-such-path"
summary = "the path is absent from the working copy and HEAD"
detail = "Correct the file or directory path and retry. Commit, log, diff, and show validate paths against disk and HEAD, so a path deleted from both may not be accepted even if it existed in older history. ff log's positional arguments are paths; select revisions with -r. ff diff's positional arguments are paths only: a revision such as main..HEAD belongs to ff show for one or ff log -r for a set. ff show's first argument is the revision and the rest are paths, so a second revision is refused rather than read as a filter. If a commit message was parsed as a path, pass it with -m. Inspect ff status for the paths in the open change."
exits = ["ff status", "ff log", "ff show <rev>"]

[[entry]]
id = "usage/git-policy"
summary = "strict Git policy refused this passthrough command"
detail = "Use the suggested fufu command when it matches your task. If you need Git's behavior, inspect ff config gitPolicy and explicitly choose coach or observe for the intended scope before retrying. Strict passthrough refusal happens before capture and Git execution but records the policy tally. The classifier is command-based: it currently refuses tag pushes too, although ff push sends branches only. There is no exact fufu replacement for a tag push. Agent policy replies also depend on the client; only the Claude adapter emits pre-tool denial replies."
exits = ["ff config gitPolicy", "ff config gitPolicy coach"]

[[entry]]
id = "usage/foreign-verb"
summary = "this Git or jj spelling needs a different fufu command"
detail = "Read the task-specific alternatives in the message. Checkout separates into switch and restore; open work is parked on switching rather than through a stash command; splitting uses partial commits or lift. Fufu does not implement every Git or jj operation. ff git runs installed Git with its own arguments and streams, but strict policy can refuse classified writes, so check ff config gitPolicy before choosing that route. ff rebase is already an alias for restack."
exits = ["ff help", "ff config gitPolicy"]

[[entry]]
id = "usage/collide-same-branch"
summary = "collide resolved both sides to the same branch"
detail = "Name two different local branches. With one argument, collide compares the current branch against the named branch, so naming the current branch repeats the same side. ff branch lists the names you can select."
exits = ["ff branch", "ff collide <a> <b>"]

[[entry]]
id = "usage/lift-from-open"
summary = "lift's requested source and default target are both the open change"
detail = "Name committed sources with --from, or a committed destination with --into when moving open-change content. Lift defaults to moving content into @; --from @ alone therefore asks to move the open change into itself. Bare ff lift takes content from HEAD when committed history exists."
exits = ["ff log", "ff lift --from <revset>", "ff lift --from @ --into <rev>"]

[[entry]]
id = "usage/needs-message"
summary = "a required commit description is missing or empty"
detail = "Supply a nonempty message with -m on the original command, retaining its revision, source, and target arguments. Bare describe needs an interactive terminal to open an editor; FF_NONINTERACTIVE disables that route. A reword also refuses an empty description, including one emptied by commit-msg, so inspect the hook if your supplied message was nonempty. ff describe -m alone saves a pending message for the open change."
exits = ["ff help describe"]

[[entry]]
id = "op/nothing-to-redo"
summary = "there is no available redo step from the current operation tip"
detail = "Inspect ff history and ff op log rather than assuming redo can skip newer work. Redo follows a retained undo path; a new operation after undo forks that history and can end the available redo path. Retained operations on an abandoned path can still be selected by ID with ff op restore. Trimming can remove that recovery state, and ff undo is a separate backward move, not a repair for an unavailable redo."
exits = ["ff history", "ff op log"]

[[entry]]
id = "usage/at-op-unsupported"
summary = "this command accepts past-state flags but does not implement them"
detail = "Remove --at-op or --at to inspect the current state. Status, log, evolog, branch listings, and worktree listings declare these flags but refuse past-state views. Only restore and op log/show/diff implement them; show, map, remote, and collide do not declare them. Use ff op show <op> for a recorded snapshot and ref transitions, or ff op diff for file differences. Restore writes selected working files, so it is not a substitute for a past-state reader when you only want to inspect."
exits = ["ff op show <op>", "ff op diff <a> <b>", "ff op log"]

[[entry]]
id = "edit/not-in-history"
summary = "the commit to edit is not in the current branch's history"
detail = "Switch to a branch containing the commit, then retry ff edit <rev>, or choose a commit from the current branch's history. Finishing an edit rewrites that branch from the edited commit onward, so the commit must be an ancestor of its tip. ff log shows the history available from the current branch."
exits = ["ff log", "ff switch <branch>"]

[[entry]]
id = "held/op-revert"
summary = "refs no longer have the values required to invert this operation"
detail = "Inspect ff op show <op> and the refs named in the error. Op revert only inverts recorded ref transitions whose current values still equal what the selected operation left. This refusal creates no held rewrite or resolution session, and ff resolve cannot repair it. Choose another applicable operation, restore selected files, or deliberately restore a whole recorded state. Restoring to <op> selects its after-state; <op>^ selects its predecessor when retained. Capture or reconciliation may already have run before the inversion was refused."
exits = ["ff op show <op>", "ff op log", "ff help op restore"]

[[entry]]
id = "held/rewrite-conflict"
summary = "a commit could not be replayed over the requested rewrite"
detail = "Inspect the named commit and paths with ff status and ff log. This is a replay refusal; the ID alone does not establish that a hold or resolution session was recorded. Ordinary conflict-aware commands usually report a held rewrite instead. Use ff resolve only on a branch whose status shows a hold. If the command repeatedly returns this error without a recorded hold, preserve the diagnostic and report the replay path. Earlier captures or objects may already have been written."
exits = ["ff status", "ff log"]

[[entry]]
id = "held/expired"
summary = "the held request or its resolution state can no longer be used"
detail = "Inspect the nested reason and current branch state. A base or target may have disappeared, a session may have been removed, or an old resolution may predate session branches. The refusal does not clear the hold. After preserving any wanted fixes, ff resolve --abandon on the held branch drops the hold and its associated resolution session. Reissue the original rewrite with current targets if it is still wanted. Legacy in-place markers may remain in working files and need separate editing or restoration."
exits = ["ff status", "ff resolve --abandon", "ff log"]

[[entry]]
id = "held/already-held"
summary = "the named branch already has a held rewrite blocking this request"
detail = "Switch to the branch named in the error, inspect its hold, and resolve or abandon it before retrying. Fufu stores one held request per branch. Some clean rewrites can proceed while a hold exists, but a competing conflict and commands such as folding a held source are refused. A multi-branch operation may already have updated other branches; inspect its per-branch report. Abandoning removes the request rather than leaving it queued."
exits = ["ff status", "ff switch <held-branch>", "ff help resolve"]

[[entry]]
id = "held/none"
summary = "the current branch has no held request to resolve or abandon"
detail = "Check ff status and switch to the branch whose hold you intended to resolve. Do not infer a hold from exit 3 alone: op-revert applicability refusals create none. A parked-change arrival resolved in place has also already cleared its hold; edit its remaining markers directly without ff done. If resolve previously released a now-clean rewrite, rerun the original rewrite command to apply it."
exits = ["ff status", "ff log"]

[[entry]]
id = "held/resolving"
summary = "a resolution session for this hold is already open"
detail = "Switch to the session branch named in the message if you are not already there, edit its conflict markers, and run ff done. A second ff resolve refuses while the session is open. To discard the request instead, ff resolve --abandon from either the session or its held branch removes both the session and the hold; preserve wanted fixes first. A held parked-change arrival uses in-place resolution and does not open this kind of session."
exits = ["ff status", "ff switch <session>", "ff help done"]

[[entry]]
id = "held/moved"
summary = "the current rewrite no longer produces the conflicts this session was opened for"
detail = "Preserve any fixes you want to reuse, then abandon the stale resolution with ff resolve --abandon. That removes both session and hold and returns from the session to its destination branch. Reissue the original rewrite against the current state, then use ff resolve if it records a new hold. Running ff resolve before abandoning only returns held/resolving. This failed done has not landed the resolution; pre-command capture or reconciliation may already have recorded your edits."
exits = ["ff status", "ff diff", "ff resolve --abandon"]

[[entry]]
id = "held/unresolved"
summary = "the resolution still has markers or produces another replay conflict"
detail = "Edit the named files on the resolution session branch and run ff done again. The original branch has not received this resolution, and the hold and session remain open. The error may describe markers still present or a fix that creates a later conflict during replay. To discard the entire request, preserve wanted fixes and use ff resolve --abandon; that drops the hold too, so starting again requires reissuing the original rewrite."
exits = ["ff status", "ff done", "ff resolve --abandon"]

[[entry]]
id = "held/unsupported"
summary = "the current open change prevents this hold from being resolved"
detail = "Preserve or commit the blocking open work, then retry resolution. For a path-filtered absorb or lift, the error names changed paths outside the saved selection. For a parked arrival, the destination already has an open change, and the held arrival needs it clean. Switching away and back merely parks and resumes that change; it does not clear the blocker. You can instead abandon the hold and reissue the intended operation with an appropriate selection. Abandoning a held arrival drops that saved arrival, so retain its snapshot if its content is wanted."
exits = ["ff status", "ff commit -m <msg>", "ff help resolve"]

[[entry]]
id = "rewrite/merge-in-range"
summary = "the requested content replay includes a merge commit"
detail = "Inspect the range and choose a supported linear range if that matches your task. Fufu refuses content replay through a merge instead of choosing one parent as its patch base. Message-only rewording can re-parent merges without replaying their content. If preserving or rewriting the merge itself is required, use an appropriate Git workflow after reviewing strict policy and saving the current work."
exits = ["ff log", "ff config gitPolicy"]

[[entry]]
id = "rewrite/not-in-history"
summary = "a selected commit is outside the history this rewrite can use"
detail = "Inspect ff log and the selected revision, then switch to the branch containing the intended history or choose different sources and target. A replay target must be an ancestor of the branch tip. Absorb and lift additionally require their committed sources on that branch's first-parent line, so a commit reachable only through a merge's other parent may still be unsuitable."
exits = ["ff log", "ff log -r <rev>"]

[[entry]]
id = "restack/no-base"
summary = "no base branch was found for this restack"
detail = "Name an appropriate base with ff restack <branch> --onto <base>. The default follows the recorded parent and falls back to trunk; trunk itself may have no distinct base. Choose a different branch with shared history, not the branch's own remote copy. Use pull for reconciliation with that copy."
exits = ["ff restack <branch> --onto <base>", "ff branch"]

[[entry]]
id = "restack/own-remote"
summary = "restack cannot target the branch's own remote copy"
detail = "Use ff pull <branch> to reconcile that branch with its remote copy. Pull fetches by default, reports incoming state, and replays local work when needed. Restack --onto selects a different base branch. If you meant another base, name it explicitly and inspect the resulting stack."
exits = ["ff pull <branch>", "ff restack <branch> --onto <base>"]

[[entry]]
id = "restack/unrelated"
summary = "the branch and requested base have no common ancestor"
detail = "Check both histories and choose a base that shares an ancestor with the branch. A restack needs a common ancestor to determine which commits belong to the replay. In a shallow clone, missing ancestry may be the cause; deepen or unshallow the relevant remote history with Git if appropriate, then retry. Fufu does not merge unrelated histories through restack."
exits = ["ff log", "ff log -r <base>", "ff restack <branch> --onto <base>"]

[[entry]]
id = "fold/trunk-source"
summary = "fold cannot remove trunk as its source branch"
detail = "Switch to the feature branch you intend to fold and run fold there. Fold incorporates that source into a local target and normally deletes the source branch. The configured trunk is refused as the source, including when you explicitly name another target. Check ff config trunk if the wrong branch is being identified as trunk."
exits = ["ff switch <branch>", "ff config trunk", "ff status"]

[[entry]]
id = "fold/remote-target"
summary = "fold requires a local target branch"
detail = "Create or select a local branch for the target before folding. If only origin/main exists, ff switch origin/main creates its local tracking branch; then switch back to the source and fold into the local name. ff branch lists the resulting names. A fold changes local history; sending the result to the remote is a separate push from the target branch."
exits = ["ff branch", "ff switch <remote>/<branch>"]

[[entry]]
id = "fold/conflict"
summary = "the source cannot replay cleanly onto the fold target"
detail = "Run ff restack --onto <target> from the source branch to perform the replay with held-conflict support. If it holds, resolve the markers through ff resolve and ff done, then retry fold. This failed fold has not folded or deleted the source and creates no fold hold. Pre-command snapshots or reconciliation may already have been recorded."
exits = ["ff restack --onto <target>", "ff status"]

[[entry]]
id = "fold/other-tree-conflict"
summary = "the target worktree's open change conflicts with the fold result"
detail = "Use ff worktree to locate the target checkout and inspect its files with ff -C <path> status. Commit its wanted open work or restore selected files there after preserving anything needed, then retry the fold. Alternatively, switch that checkout off the target so a normal fold can land it here. Neither branch has received this fold, but both worktrees may already have been captured. Retrying a plain fold while the target remains checked out elsewhere produces branch/checked-out-elsewhere."
exits = ["ff worktree", "ff -C <path> status"]

[[entry]]
id = "session/none"
summary = "the current branch is not an editing session to finish or abandon"
detail = "Switch to the session branch if an edit or rewrite resolution is open elsewhere. ff status identifies the current branch's session state. To start a new edit, use ff edit <rev> on a commit in the current branch's history. A parked-change arrival resolved in place is ordinary open work and has no session for ff done to finish."
exits = ["ff status", "ff branch", "ff help edit"]

[[entry]]
id = "session/open"
summary = "an editing session blocks the requested operation"
detail = "Switch to the session branch named in the error, then use ff done to land its work or ff done --abandon to discard the session. Preserve wanted edits before abandoning. Commit, nested edit, and operations that would move a session branch are refused while it is active. Switching away defers the session without ending it; when the error names a target session on another branch, choose a different target or finish that session there."
exits = ["ff status", "ff switch <session>", "ff help done"]

[[entry]]
id = "session/moved"
summary = "the editing session branch no longer has its expected commit structure"
detail = "Inspect the session's history before choosing how to preserve it. An outside Git commit or other history change can move the session away from its original anchor, and done refuses to fold those extra commits into one edited commit. Save wanted commits under another ordinary branch and preserve uncommitted files before ff done --abandon, which removes the session branch and returns without landing it. A retained undo step may instead undo the outside move; inspect ff history before selecting it."
exits = ["ff log", "ff history", "ff help done"]

[[entry]]
id = "session/unreachable"
summary = "the edited commit is no longer in the destination branch's history"
detail = "Inspect the destination branch and session before retrying. Something moved the destination while the edit was open, so done cannot replay it from the original anchor. Preserve any wanted session work, then ff done --abandon returns without landing it. You can open a new edit on the destination's current history, or use a retained recovery point if the destination move itself was unintended."
exits = ["ff log", "ff history", "ff done --abandon"]

[[entry]]
id = "usage/restack-onto-self"
summary = "a branch cannot be restacked onto itself"
detail = "Name a different base with --onto, or omit --onto to use the recorded base when one exists. The resolved base and branch must differ, even if you spelled the same branch two different ways. Use ff branch to inspect the available names."
exits = ["ff restack <branch> --onto <base>", "ff branch"]

[[entry]]
id = "usage/fold-into-self"
summary = "a branch cannot be folded into itself"
detail = "Choose a different local target branch. With no target, fold uses trunk; the current source must still be a different, non-trunk branch. ff branch lists the names, and ff status confirms which source you are on."
exits = ["ff fold <target>", "ff branch"]

[[entry]]
id = "usage/bad-session"
summary = "the session label is empty, too long, or contains control characters"
detail = "Use a nonempty label of at most 128 UTF-8 bytes after leading and trailing whitespace is trimmed. Spaces inside the label, punctuation, and Unicode are accepted; control characters and internal line breaks are not. Quote labels containing spaces. This is the --session provenance label for new records, not the name of an ff edit or ff resolve branch."
exits = []

[[entry]]
id = "push/no-git"
summary = "fufu could not start Git for the network operation"
detail = "Install Git, ensure its executable is on this process's PATH, and verify git --version in the same terminal or agent environment before retrying the original command. An installed but unlaunchable executable can also produce this ID. Push and remote deletion use Git; a narrow fetch fallback also invokes it. ff git push cannot repair a missing Git executable and may itself be refused by strict policy. Local capture or upstream configuration may already have happened before this launch failure."
exits = ["git --version"]

[[entry]]
id = "pull/fetch-failed"
summary = "the remote fetch or its repository setup failed"
detail = "Inspect the fetch diagnostic and remote URL, then repair authentication, connectivity, repository administration, or configuration as indicated. Fetch normally uses fufu's native backend, which does not honor Git's http.proxy; ff git fetch <remote> uses installed Git's transport and can help diagnose that difference. After a successful Git fetch, ff pull --no-fetch uses the updated tracking refs. Without a successful refresh, --no-fetch deliberately uses cached state. Failed fetches can leave received objects or partial tracking updates; the pull's history reconciliation has not proceeded past this fetch failure."
exits = ["ff remote", "ff git fetch <remote>", "ff help pull"]

[[entry]]
id = "fetch/not-here"
summary = "this command does not support the --fetch preflight"
detail = "Remove --fetch from this command. To refresh remote state, run ff pull or ff status --fetch separately. Commands that support automatic fetching follow fufu.autoFetch's cadence; pull performs its own foreground fetch unless --no-fetch is given. This error does not mean all commands are offline or that removing --fetch disables other maintenance."
exits = ["ff pull", "ff status --fetch"]

[[entry]]
id = "push/unreachable"
summary = "Git reported a connection, authentication, or repository failure"
detail = "Check the remote URL and Git diagnostic, then repair connectivity, credentials, or repository access. This classification is based on Git exiting 128 and does not prove the remote never answered. ff git ls-remote <remote> checks advertised refs using Git without sending an update. Earlier branches in a multi-branch push may already have succeeded. On a shared branch deletion, the local deletion may already have happened; inspect ff status and ff op log."
exits = ["ff remote", "ff git ls-remote <remote>", "ff status"]

[[entry]]
id = "push/lease-refused"
summary = "the expected remote tip no longer permits this push"
detail = "Run ff pull <branch>, review incoming work and any hold, then retry the push when the branch is ready. A replacing push requires its seen record to agree with the tracking tip; a fast-forward may proceed without that agreement. The send also checks the expected tracking tip at the remote, with an empty expectation for a new copy. Either a local mismatch or a remote race can refuse this branch. Other branches may already have been sent; a lease is not a team-policy or ownership check."
exits = ["ff pull <branch>", "ff status"]

[[entry]]
id = "push/unseen"
summary = "replacing remote commits requires a seen record that is missing"
detail = "Run ff pull <branch> to fetch and report its remote copy, inspect the result, and resolve any hold before pushing. A fetch alone does not establish the seen record. A fast-forward of the cached tracking tip is allowed without one, but this push would replace commits outside the local branch's history. This branch was refused before its send; a multi-branch run may still send other branches."
exits = ["ff pull <branch>", "ff status"]

[[entry]]
id = "push/rejected"
summary = "the remote rejected the requested ref update"
detail = "Read the remote's reason and address its permissions, protected-branch rules, or receive-hook requirements before retrying the same intended update. Repeating it through ff git push does not bypass those rules and can be refused locally under strict policy. Other branches in a multi-branch push may already have succeeded. Upstream configuration or capture can also have changed locally; for a shared deletion, the local branch was deleted before the remote request."
exits = ["ff status", "ff remote"]

[[entry]]
id = "push/failed"
summary = "Git failed to complete the requested remote update"
detail = "Read the Git diagnostic, inspect the remote with ff git ls-remote <remote>, and correct the reported problem before retrying the original command. This ID covers failures not classified as a lease mismatch, remote rejection, or Git exit 128; do not infer an unchanged remote solely from this classification. Earlier sends, local captures, and upstream configuration may already have happened. For shared deletion, inspect the local deletion too."
exits = ["ff git ls-remote <remote>", "ff status", "ff op log"]

[[entry]]
id = "push/unrecorded"
summary = "the remote update succeeded but local push bookkeeping failed"
detail = "Inspect the remote ref and ff op log before any further rewrite or push. The reported send succeeded; a later note, published pointer, or seen pointer could not be written, and some of those local writes may already exist. Undo cannot reverse the remote update. Fix the reported local write problem, but do not assume another ff push repairs the record: when the tracking tip already equals the local tip, it reports nothing to push without recording again. A reporting pull refreshes seen state but does not reconstruct a missing push note or published pointer, and may replay history. Preserve the diagnostic for repair follow-up."
exits = ["ff git ls-remote <remote>", "ff op log", "ff status"]

[[entry]]
id = "push/unknown-remote"
summary = "--to named a remote that is not configured"
detail = "Choose a configured remote from ff remote, or add the intended name and URL with ff git remote add <name> <url>, then retry --to with that name. --to chooses a destination; it does not interpret its argument as a URL or create remote configuration by itself. The Git passthrough requires Git installed."
exits = ["ff remote", "ff git remote add <name> <url>"]

[[entry]]
id = "push/retarget"
summary = "--to conflicts with the branch's configured remote"
detail = "Omit --to to send to the existing remote. To change the upstream deliberately, first fetch the intended remote and confirm its branch exists, then use git branch --set-upstream-to=<remote>/<branch> <local-branch>. This is Git configuration work; ff git branch can be refused under strict policy. Review the new copy with ff pull <local-branch> before pushing a replacement. Fufu maintains one configured remote copy per branch, not independent push records for several destinations."
exits = ["ff remote", "ff branch", "ff config gitPolicy"]

[[entry]]
id = "pull/ambiguous-remote"
summary = "multiple remotes are configured and this branch has no selected remote"
detail = "Choose the intended remote from ff remote. If its branch exists, fetch it and set the local branch's upstream with git branch --set-upstream-to=<remote>/<branch> <local-branch>, then retry. If you intend to create a remote copy by sending local commits, ff push --to <remote> can select and send in one command; it is not a read-only repair. A branch with an upstream, a sole remote, or a remote named origin supplies a default."
exits = ["ff remote", "ff branch", "ff help push"]

[[entry]]
id = "init/bare"
summary = "ff init does not create bare repositories"
detail = "Use ff init <directory> for a repository with working files. If you need a bare Git repository, use git init --bare <directory>; it has no working copy for fufu snapshots. An ff git init passthrough from inside a strict-policy repository can be refused, so inspect that policy before using the passthrough form."
exits = ["git init --bare <directory>"]

[[entry]]
id = "init/failed"
summary = "the repository could not be created at that path"
detail = "Check the filesystem reason in the error: the path may be a file, permissions may prevent creation, or the volume may be full. Correct that problem or choose another directory, inspect any partial directory before reusing it, and retry ff init. Snapshot setup happens only after repository creation succeeds; this error is not evidence that no directories or files were created."
exits = []

[[entry]]
id = "clone/target-exists"
summary = "the clone destination is not empty"
detail = "Choose a new or empty destination directory with ff clone <url> <directory>. Move existing files somewhere appropriate if you intended to reuse this location. Fufu refuses to clone over them. If you intended to initialize or adopt the existing directory instead, run ff init in that directory; initialization does not download the requested remote."
exits = ["ff clone <url> <directory>"]

[[entry]]
id = "clone/bad-url"
summary = "the clone URL, name, or destination setup is invalid"
detail = "Correct the item named in the diagnostic. This ID covers URL and destination setup failures, invalid --branch or --origin names, and a URL from which no destination name can be inferred. Use an explicit destination when necessary. Supported address forms include HTTPS, SSH, git://, local paths, and user@host:path. A valid-looking URL alone does not establish that the repository is reachable or accessible."
exits = ["ff help clone"]

[[entry]]
id = "clone/unreachable"
summary = "the clone transport could not establish a connection"
detail = "Check the address, local path, network, and SSH or credential-helper setup named in the diagnostic, then retry. With Git installed, ff git ls-remote <url> can compare Git's ability to reach it. Native HTTP clone does not honor Git's http.proxy, so Git succeeding does not prove the transports have identical configuration. Failed-clone cleanup is attempted by the clone backend; inspect the destination before reusing it."
exits = ["ff help clone"]

[[entry]]
id = "clone/refused"
summary = "clone could not fetch the requested repository or branch"
detail = "Check the diagnostic for authentication, permissions, a missing or ambiguous --branch, protocol failure, or another fetch-stage error. With Git installed, ff git ls-remote <url> shows advertised names and helps check access; retry with the intended branch spelling and credentials. This is the fetch-stage fallback classification, so it does not always mean a server policy rejected the request. Inspect the destination if cleanup did not complete."
exits = ["ff help clone"]

[[entry]]
id = "clone/failed"
summary = "objects arrived but the working-copy checkout failed"
detail = "Correct the checkout problem named in the error, such as an unsupported filename, permissions, interruption, or disk space. The clone backend attempts to remove a destination it verified as empty or absent before creation; it preserves the directory if it could not verify emptiness. Cleanup failures are not reported separately, so inspect any remaining files before retrying into a new or empty destination. This error happens before fufu finishes snapshot setup for the checkout."
exits = ["ff help clone"]

[[entry]]
id = "worktree/exists"
summary = "the worktree destination is occupied or cannot be named"
detail = "Choose a normal directory path that does not exist or is empty. A file, symlink, nonempty directory, or path without a usable final component can be refused. A new branch may already have been created before the destination check; inspect ff branch before retrying. Preserve existing contents before moving them out of the way. When restoring a removed worktree, free its recorded path before retrying recovery; otherwise restore selected captured files into an existing checkout."
exits = ["ff worktree", "ff help worktree"]

[[entry]]
id = "worktree/not-found"
summary = "no linked worktree matches that ID or path"
detail = "Use ff worktree to find the current ID and path, then retry with one of those values. IDs usually derive from the checkout basename but can have a suffix to avoid collisions. A missing checkout may still have an administrative entry to remove, while a retained operation chain alone is not a live worktree. Use retained operation IDs for recovery of an already removed checkout."
exits = ["ff worktree"]

[[entry]]
id = "worktree/is-main"
summary = "the main worktree cannot be removed by this command"
detail = "Choose a linked worktree from ff worktree instead. The main worktree contains the shared Git administration used by linked checkouts, and ff worktree -d does not remove it. If the whole repository is no longer needed, first preserve wanted files and retained history before managing its directory outside this command."
exits = ["ff worktree"]

[[entry]]
id = "worktree/unborn"
summary = "the worktree needs a committed checkout target"
detail = "Create the first nonempty commit in the existing working copy, then retry adding the worktree. A new worktree needs a commit to check out; an unborn branch has none. Add or edit a file before ff commit if the current open change is empty."
exits = ["ff status", "ff commit -m <message>"]

[[entry]]
id = "worktree/is-current"
summary = "the checkout to remove is the command's current worktree"
detail = "Run removal from another checkout, for example ff -C <other-checkout> worktree -d <id>. ff worktree shows the paths. Before removing it, preserve ignored, oversized, or otherwise uncaptured content separately; removal captures eligible on-disk content but cannot save excluded bytes or unsaved editor buffers. The removed worktree's retained operation chain is the file-recovery source."
exits = ["ff worktree", "ff worktree -C <other-checkout> -d <id>"]

[[entry]]
id = "worktree/busy"
summary = "the target worktree's snapshot could not acquire its operation-log lock"
detail = "Wait for the writer in the named checkout, then retry from another worktree. If the lock remains without a live writer, investigate it before another removal attempt. The blocked checkout has not been removed by this attempt, but the invoking checkout may already have been captured or earlier recovery effects applied. A successful removal captures only eligible content: copy ignored, oversized, uncaptured, or unsaved work separately before removing the checkout."
exits = ["ff worktree"]

[[entry]]
id = "usage/unknown-error-id"
summary = "this binary has no catalog entry for that error ID"
detail = "Copy the ID exactly from the failure or select one from ff explain --list. The catalog belongs to the installed binary; IDs and payloads have changed across releases even when the envelope stayed at ff: 1. If diagnosing output from another version, use that version's catalog. Scripts should pin and test supported versions rather than parse message prose."
exits = ["ff explain --list", "ff version"]

[[entry]]
id = "repo/not-found"
summary = "a Git repository could not be discovered from this directory"
detail = "Run the command inside the intended checkout or use ff -C <path>. Fufu searches the current directory and its parents; the diagnostic may also identify discovery or access problems. If no repository exists yet, ff init creates one with snapshots enabled, and ff clone <url> creates a checkout from an existing repository. Neither is a repair for merely being in the wrong directory."
exits = ["ff -C <path> status", "ff help init", "ff help clone"]

[[entry]]
id = "internal"
summary = "an unclassified failure"
detail = "Read the underlying diagnostic and inspect any reported partial result before retrying. This fallback covers filesystem, Git-library, and fufu failures without a more specific catalog ID; it does not establish whether state changed. Correct a concrete access, disk-space, or configuration problem when named. For a reproducible unexplained failure, report the command, ff version, diagnostic, and relevant repository state without including credentials or private file contents."
exits = []
