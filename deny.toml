# cargo-deny configuration — enforced in CI (`cargo deny check licenses`).
# Policy: permissive licenses only; no copyleft (GPL/LGPL/AGPL/MPL/etc).

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
]
# The one non-permissive license in the tree. MPL-2.0 is file-level copyleft:
# linking imposes nothing on fufu's code; only modifications to uluru itself
# would have to be published. Pulled in transitively by gix-pack — unavoidable
# while we depend on gix. Scoped to this crate so no other MPL code sneaks in.
exceptions = [
    { allow = ["MPL-2.0"], crate = "uluru" },
]
