name: ci

# Docs-only changes are docs.yml's job: a push touching nothing but these
# paths deploys the site without spinning the rust matrix. A mixed commit
# still runs everything — paths-ignore only skips when *every* changed file
# matches — so the generated docs/reference/cli/ pages riding a code commit
# get full CI, generator test included.
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - CHANGELOG.md
      - DESIGN.md
  pull_request:
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - CHANGELOG.md
      - DESIGN.md

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # Windows is sharded four ways because of a cost measured on the runners
  # rather than guessed at: creating a process costs 0.59ms on Linux and
  # 6.6ms on Windows, and this suite spawns a real `git` per assertion, so
  # that tax is most of the wall clock. It is the platform and not the host
  # -- real Windows hardware pays the same 6.2ms -- so the only lever is
  # more cores to pay it with concurrently, which is what a shard is. Disk
  # was measured not to be the problem: fsync latency on the Windows runner
  # is 1.0x Linux and bulk throughput 1.2x.
  #
  # macOS pays the same tax at ~5x Linux and would shard just as well, but
  # deliberately does not. Windows gates the run at ~5m45s, so a macOS leg
  # finishing in 110s rather than 172s buys nothing at all -- while a second
  # macOS job repeats the build on the platform that bills at ten times the
  # Linux rate. Shard it only if it ever becomes the leg the run waits on.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `lints` and `saves` are spread across different shards on
          # purpose: clippy costs ~93s and writing the cache back ~48s, and
          # the whole run is gated on whichever job finishes last, so putting
          # both on one shard is what made shard 1 the straggler at 9m28s
          # against its siblings' 5m05s.
          - { os: ubuntu-latest, name: linux, shard: 1, shards: 1, lints: true, saves: true }
          - { os: macos-latest, name: macos, shard: 1, shards: 1, lints: true, saves: true }
          - { os: windows-latest, name: windows 1/4, shard: 1, shards: 4, lints: true, saves: false }
          - { os: windows-latest, name: windows 2/4, shard: 2, shards: 4, lints: false, saves: true }
          - { os: windows-latest, name: windows 3/4, shard: 3, shards: 4, lints: false, saves: false }
          - { os: windows-latest, name: windows 4/4, shard: 4, shards: 4, lints: false, saves: false }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Worth somewhere between 1.1x and 1.7x on `git` spawns across two
      # probe runs -- the win is real but the runner's own variance is the
      # same order, so do not read a precise figure into it. It goes before
      # the cache restore so that unpacking the target directory is not
      # scanned either. Disabling real-time protection outright measured no
      # better than excluding these paths, so this is the whole dose.
      - name: Exclude the build from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "git.exe"

      # rustup on the runners picks the toolchain up from rust-toolchain.toml.
      # The shards share one cache rather than filling the repository's cache
      # budget with four copies of the same Windows target directory, and
      # exactly one of them writes it back.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
          save-if: ${{ matrix.saves }}

      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # One shard's worth: the lint answer does not differ between shards.
      - if: matrix.lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest is what makes `--partition` possible, and it also packs every
      # test into one scheduling pool instead of running 90 binaries end to
      # end with a ragged tail on each.
      - run: cargo nextest run --workspace --partition hash:${{ matrix.shard }}/${{ matrix.shards }}
      # nextest does not run doctests. There are none today, and this is what
      # keeps that true rather than silently skipped.
      - if: runner.os == 'Linux'
        run: cargo test --workspace --doc

      # The installers can't run in CI, but they can at least parse.
      - if: runner.os == 'Linux'
        run: sh -n install.sh
      - if: matrix.os == 'windows-latest' && matrix.lints
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs; exit 1 }

  # The release profile is fat-LTO and single-codegen-unit, so it is built
  # once, here, rather than on all three platforms in the test matrix: the
  # Windows copy alone cost 228s and produced nothing anyone downloads.
  # release.yml builds all six shipping targets at tag time, which is the
  # build whose output is real. This job exists because bench needs a release
  # binary and must not build one from scratch.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-build
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: ff-linux
          path: target/release/ff

  # The recordings -- the demo on the README and the docs home page, and one
  # per tutorial section -- are rendered by hand: rendering wants a browser, a
  # terminal server and ffmpeg, none of which this job needs. What it does is
  # prove they are not stale. The demo's commands are replayed with no
  # terminal at all against a golden transcript; the tutorial's are replayed
  # for their exit status, which is what catches a renamed verb without a
  # golden file that would churn on every release. A failure means a verb
  # moved and a recording still shows the old one, so re-render with
  # `make demo`.
  demo:
    needs: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: ff-linux
          path: target/release
      - run: chmod +x target/release/ff
      - run: FF=target/release/ff scripts/docs/demo-check.sh
      - run: FF=target/release/ff scripts/docs/tutorial-tapes.sh --check

  # Guards fufu's core claim -- no linear-time costs -- by failing when a
  # flat-declared row scales with its axis. Reduced matrix only (100/1000
  # points, ff alone, no jj); the full 10 000-point comparison matrix is
  # local-only, this job exists purely as the ratio gate.
  bench:
    needs: release-build
    runs-on: ubuntu-latest
    # Nothing in this job legitimately takes fifteen minutes; the cap exists so
    # a wedged install can never hold a runner for the six-hour default again.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: ff-linux
          path: target/release
      - run: chmod +x target/release/ff
      # A static binary from the project's own releases, not apt: the Ubuntu
      # archive mirrors stalled this job twice in two days, and `apt-get
      # update` has no timeout of its own to fail against. GitHub is already
      # load-bearing here for checkout and artifacts, so this adds no new
      # point of failure -- and it drops sudo, dpkg, and dependency
      # resolution for a 710 KB download. The version is pinned because
      # run.sh records `hyperfine --version` as provenance in raw.json:
      # unpinned, the gate's tool version is whatever the runner's archive
      # happened to serve that morning. 1.18.0 is what apt was serving, so
      # pinning it keeps the recorded numbers continuous.
      - name: Install hyperfine
        env:
          HYPERFINE_VERSION: 1.18.0
        run: |
          mkdir -p "$RUNNER_TEMP/hyperfine"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/hyperfine"
          echo "$RUNNER_TEMP/hyperfine" >> "$GITHUB_PATH"
      - run: hyperfine --version
      - run: scripts/bench/run.sh --points 100,1000 --tools ff
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-raw-json
          path: bench-results/raw.json
      - run: scripts/bench/report.py
