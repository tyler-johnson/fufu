name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rustup on the runners picks the toolchain up from rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      # The installers can't run in CI, but they can at least parse.
      - if: runner.os == 'Linux'
        run: sh -n install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs; exit 1 }
      # bench needs the release binary but must not rebuild it from scratch.
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ff-linux
          path: target/release/ff

  # Guards fufu's core claim -- no linear-time costs -- by failing when a
  # flat-declared row scales with its axis. Reduced matrix only (100/1000
  # points, ff alone, no jj); the full 10 000-point comparison matrix is
  # local-only, this job exists purely as the ratio gate.
  bench:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ff-linux
          path: target/release
      - run: chmod +x target/release/ff
      - run: sudo apt-get update && sudo apt-get install -y hyperfine
      - run: scripts/bench/run.sh --points 100,1000 --tools ff
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-raw-json
          path: bench-results/raw.json
      - run: scripts/bench/report.py
