name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # No cross-compiling: six native runners, each building its own target.
  # Artifact contract (shared with install.sh/install.ps1 and the formula):
  # ff_<version>_<os>_<arch>.tar.gz (zip on windows), checksums.txt with
  # `<sha256>  <filename>` lines.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-13 }
          - { os: darwin, arch: arm64, runner: macos-latest }
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release -p ff-cli
      - name: archive (tar.gz)
        if: matrix.os != 'windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="ff_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "dist/$NAME"
          cp target/release/ff LICENSE README.md "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C "dist/$NAME" ff LICENSE README.md
      - name: archive (zip)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "ff_${version}_${{ matrix.os }}_${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/ff.exe, LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ff_${{ matrix.os }}_${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $CARGO_VERSION" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum -- * > checksums.txt
          cat checksums.txt
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "fufu $GITHUB_REF_NAME" --notes-file "$NOTES" dist/*
          else
            gh release create "$GITHUB_REF_NAME" --title "fufu $GITHUB_REF_NAME" --generate-notes dist/*
          fi

  # Formula bump into the tap (goreleaser's `brews` job for jog, by hand).
  # Cross-repo push needs its own token: a fine-grained PAT with
  # contents:write on homebrew-tap, stored as HOMEBREW_TAP_GITHUB_TOKEN.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v5
        with:
          repository: tyler-johnson/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap
      - name: write formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/tyler-johnson/fufu/releases/download/$GITHUB_REF_NAME"
          cd dist && sha256sum -- *.tar.gz > sums.txt && cd ..
          sha() { awk -v f="ff_${VERSION}_$1.tar.gz" '$2 == f {print $1}' dist/sums.txt; }
          mkdir -p tap/Formula
          cat > tap/Formula/fufu.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # This file was generated by fufu's release workflow. DO NOT EDIT.
          class Fufu < Formula
            desc "jj's workflow on git's repository - the working tree is the open change"
            homepage "https://github.com/tyler-johnson/fufu"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "$BASE/ff_${VERSION}_darwin_amd64.tar.gz"
                sha256 "$(sha darwin_amd64)"
              end
              if Hardware::CPU.arm?
                url "$BASE/ff_${VERSION}_darwin_arm64.tar.gz"
                sha256 "$(sha darwin_arm64)"
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "$BASE/ff_${VERSION}_linux_amd64.tar.gz"
                sha256 "$(sha linux_amd64)"
              end
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "$BASE/ff_${VERSION}_linux_arm64.tar.gz"
                sha256 "$(sha linux_arm64)"
              end
            end

            def install
              bin.install "ff"
            end

            def caveats
              <<~EOS
                fufu only captures when something invokes it. Wire the triggers:

                  ff hook shell install          # alias git='ff git' in your shell rc
                  ff hook agent install claude   # capture around Claude Code's tool actions
              EOS
            end

            test do
              system bin/"ff", "--version"
            end
          end
          EOF
          ruby -c tap/Formula/fufu.rb
      - name: push formula
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fufu.rb
          git commit -m "fufu $GITHUB_REF_NAME"
          git push
