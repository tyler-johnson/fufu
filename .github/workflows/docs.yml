name: docs

# Docs-only pushes deploy the site and skip the rust matrix (ci.yml carries
# the mirror-image paths-ignore). The generated reference under
# docs/reference/cli/ rides code commits, so those runs get full CI too —
# which is right, because the generator test is what proves the pages fresh.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, newest wins; a stale build never overwrites a newer
# one because the artifact is tied to its own run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
